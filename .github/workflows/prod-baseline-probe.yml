name: Supabase production baseline credential probe

on:
  push:
    branches:
      - chore/prod-baseline-repair

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PRODUCTION_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
      SUPABASE_DB_PASSWORD_FALLBACK: ${{ secrets.SUPABASE_DB_PASSWORD }}
      EXPECTED_PROJECT_REF: xuodcqaxsnekdzjuvykw
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI 2.115.0
        uses: supabase/setup-cli@v3
        with:
          version: 2.115.0

      - name: Verify CLI version
        shell: bash
        run: |
          set -euo pipefail
          test "$(supabase --version)" = "2.115.0"
          echo "Supabase CLI: $(supabase --version)"

      - name: Verify migration files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort)
          printf 'Migration files:\n%s\n' "${files[*]}"
          test "${#files[@]}" -eq 2
          test "${files[0]}" = "202608240001_initial_schema.sql"
          test "${files[1]}" = "202608250001_record_edit_and_multi_meal.sql"
          git diff --exit-code -- supabase/migrations

      - name: Verify production credential secrets are present
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "SUPABASE_ACCESS_TOKEN secret is missing"; exit 11; }
          if [ -n "${PRODUCTION_DB_PASSWORD:-}" ]; then
            echo "Database password secret: PRODUCTION_DB_PASSWORD is present"
          elif [ -n "${SUPABASE_DB_PASSWORD_FALLBACK:-}" ]; then
            echo "Database password secret: SUPABASE_DB_PASSWORD is present"
          else
            echo "Neither PRODUCTION_DB_PASSWORD nor SUPABASE_DB_PASSWORD secret is present"
            exit 12
          fi
          echo "SUPABASE_ACCESS_TOKEN is present"

      - name: Verify Supabase account can see expected production project
        shell: bash
        run: |
          set -euo pipefail
          supabase projects list | tee /tmp/projects.txt
          grep -F "$EXPECTED_PROJECT_REF" /tmp/projects.txt
          grep -F "mongle-cube" /tmp/projects.txt
