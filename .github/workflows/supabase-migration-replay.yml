name: Supabase migration replay

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-migrations:
    name: Supabase migration replay
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.115.0

      - name: Record Supabase CLI version
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/supabase-validation
          supabase --version 2>&1 | tee /tmp/supabase-validation/cli-version.txt

      - name: Initialize runner-only Supabase config
        shell: bash
        run: |
          set -euo pipefail
          supabase init --force 2>&1 | tee /tmp/supabase-validation/init.txt

      - name: Start local database and apply migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db start 2>&1 | tee /tmp/supabase-validation/db-start.txt

      - name: Clean replay from migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db reset --local --no-seed 2>&1 | tee /tmp/supabase-validation/db-reset.txt

      - name: Verify 12-digit migration versions
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --local 2>&1 | tee /tmp/supabase-validation/migration-list-before-repair.txt
          grep -Fq '202608240001' /tmp/supabase-validation/migration-list-before-repair.txt
          grep -Fq '202608250001' /tmp/supabase-validation/migration-list-before-repair.txt

      - name: Repair history roundtrip locally
        shell: bash
        run: |
          set -euo pipefail
          supabase migration repair 202608240001 202608250001 --status reverted --local 2>&1 | tee /tmp/supabase-validation/repair-reverted.txt
          supabase migration repair 202608240001 202608250001 --status applied --local 2>&1 | tee /tmp/supabase-validation/repair-applied.txt

      - name: Verify migration list after repair
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --local 2>&1 | tee /tmp/supabase-validation/migration-list-after-repair.txt
          grep -Fq '202608240001' /tmp/supabase-validation/migration-list-after-repair.txt
          grep -Fq '202608250001' /tmp/supabase-validation/migration-list-after-repair.txt

      - name: Verify no pending local migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --local --dry-run 2>&1 | tee /tmp/supabase-validation/db-push-dry-run.txt
          if grep -Eq 'Would push migration|Applying migration' /tmp/supabase-validation/db-push-dry-run.txt; then
            echo 'Pending migration detected in local dry-run.' >&2
            exit 1
          fi
          grep -Eiq '(database|project) is up to date' /tmp/supabase-validation/db-push-dry-run.txt

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-migration-replay-logs
          path: /tmp/supabase-validation
          if-no-files-found: warn

      - name: Stop local containers
        if: always()
        shell: bash
        run: supabase stop --no-backup
